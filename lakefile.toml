name = "persistence-lean-new"
version = "0.1.0"
keywords = ["lean", "formal-verification", "structural-persistence"]
description = "Curated Lean core for Structural Persistence Theory"
defaultTargets = ["Persistence"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"

[[lean_lib]]
name = "Persistence"
